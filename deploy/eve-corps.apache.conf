<VirtualHost *:80>
    DocumentRoot /home/web/corps/htdocs
    ServerName eve-corps.online
    ServerAlias www.eve-corps.online
    ErrorLog  "|/usr/local/sbin/cronolog /home/web/corps/logs/%Y/%m/%d/error.log"
    CustomLog  "|/usr/local/sbin/cronolog /home/web/corps/logs/%Y/%m/%d/combined.log" combined

<directory /home/web/corps/htdocs/>
order deny,allow
allow from all
Require all granted
    AllowOverride All

</directory>

RewriteEngine On

RewriteRule ^/\.well-known/ - [L]
# Keep the path; the query string is carried over automatically.
RewriteRule ^/(.*)$ https://eve-corps.online/$1 [R=301,L]

</VirtualHost>


<VirtualHost *:443>

    DocumentRoot /home/web/corps/htdocs
    ServerName eve-corps.online
    ServerAlias www.eve-corps.online
    ErrorLog  "|/usr/local/sbin/cronolog /home/web/corps/logs/%Y/%m/%d/error.log"
    CustomLog  "|/usr/local/sbin/cronolog /home/web/corps/logs/%Y/%m/%d/combined.log" combined env=!dontlog

SetOutputFilter DEFLATE


SSLEngine on
SSLHonorCipherOrder On
# No OCSP stapling: the cert has no OCSP URI (AH02218).
#SSLCipherSuite EECDH+ECDSA+AESGCM:EECDH+aRSA+AESGCM:EECDH+ECDSA+SHA384:EECDH+ECDSA+SHA256:EECDH+aRSA+SHA384:EECDH+aRSA+SHA256:EECDH+aRSA+RC4:EECDH:EDH+aRSA:RC4:!aNULL:!eNULL:!LOW:!3DES:!MD5:!EXP:!PSK:!SRP:!DSS
#SSLCipherSuite EECDH+ECDSA+AESGCM:EECDH+aRSA+AESGCM:EECDH+ECDSA+SHA384:EECDH+ECDSA+SHA256:EECDH+aRSA+SHA384:EECDH+aRSA+SHA256:EECDH:EDH+aRSA:!aNULL:!eNULL:!LOW:!3DES:!MD5:!EXP:!PSK:!SRP:!DSS:!RC4
SSLCipherSuite ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:DHE-DSS-AES128-GCM-SHA256:kEDH+AESGCM:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA:ECDHE-ECDSA-AES256-SHA:DHE-DSS-AES128-SHA256:DHE-DSS-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA:AES256-SHA:AES:CAMELLIA:DES-CBC3-SHA:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!MD5:!PSK:!aECDH:!EDH-DSS-DES-CBC3-SHA:!EDH-RSA-DES-CBC3-SHA:!KRB5-DES-CBC3-SHA:!DHE-RSA-AES128-GCM-SHA256:!DHE-RSA-AES256-GCM-SHA384:!DHE-RSA-AES128-SHA256:!DHE-RSA-AES256-SHA:!DHE-RSA-AES128-SHA:!DHE-RSA-AES256-SHA256:!DHE-RSA-CAMELLIA128-SHA:!DHE-RSA-CAMELLIA256-SHA

SSLCertificateFile "/home/web/conf/ssl/acmesh/corps.crt"
SSLCertificateKeyFile "/home/web/conf/ssl/acmesh/corps.key"


SSLProtocol +TLSv1.2 +TLSv1.3

# Flask app (/home/web/corps, evecorps.service, gunicorn on 127.0.0.1:8002).
# Old PHP site: archived in /home/web/archive/corps-php/, vhost in /home/web/conf/servers/old/eve-corps-php.conf
<Directory /home/web/corps/htdocs/>
    Require all granted
    AllowOverride None
</Directory>

Alias /static/ /home/web/corps/evecorps/static/
<Directory /home/web/corps/evecorps/static/>
    Require all granted
</Directory>

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"
ProxyPass /.well-known/ !
ProxyPass /static/ !
ProxyPass / http://127.0.0.1:8002/
ProxyPassReverse / http://127.0.0.1:8002/


</VirtualHost>

