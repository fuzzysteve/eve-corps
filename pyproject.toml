[project]
name = "evecorps"
version = "0.1.0"
description = "eve-corps.online: find and advertise EVE Online corporations"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "pyjwt[crypto]>=2.9",
    "gunicorn>=23.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
